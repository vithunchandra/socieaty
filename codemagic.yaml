workflows:
  ios-app-build:
    name: iOS App Build
    instance_type: mac_mini_m2

    environment:
      groups:
        - socieaty

    scripts:
      - name: Get Flutter dependencies and generate code
        script: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Install iOS Pods
        script: |
          cd ios
          # Recommended for clean CI builds:
          pod deintegrate
          rm -f Podfile.lock # Use -f for force removal without prompt
          pod install --repo-update
          cd $CM_BUILD_DIR

      - name: Build iOS App
        script: |
          flutter build ios --release # Example: for App Store distribution

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log



workflows:
  ios-app-build:
    name: iOS App Build (Simulator Only)
    instance_type: mac_mini_m1 

    environment:
      groups:
        - socieaty
      IOS_DEPLOYMENT_TARGET: 13.0 

    scripts:
      - name: Clean Flutter & Get Pub Dependencies
        script: |
          flutter clean
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs # If you use build_runner

      - name: Set iOS Deployment Target & Podfile Platform
        script: |
          echo "Setting iOS Deployment Target to $IOS_DEPLOYMENT_TARGET"
          if [ -f "ios/Podfile" ]; then
            sed -i '' "s|platform :ios, '[0-9.]*'|platform :ios, '$IOS_DEPLOYMENT_TARGET'|g" ios/Podfile
          else
            echo "Error: ios/Podfile not found. flutter pub get might have failed."
            exit 1
          fi
          ruby -i -pe "gsub(/IPHONEOS_DEPLOYMENT_TARGET = (.*);/, 'IPHONEOS_DEPLOYMENT_TARGET = $IOS_DEPLOYMENT_TARGET;')" ios/Runner.xcodeproj/project.pbxproj
          echo "iOS Deployment Target set in project.pbxproj"
          XCCONFIG_DEBUG_PATH="ios/Flutter/Debug.xcconfig"
          XCCONFIG_RELEASE_PATH="ios/Flutter/Release.xcconfig"
          if ! grep -q "#include \"Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig\"" "$XCCONFIG_DEBUG_PATH"; then
              echo "#include \"Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig\"" >> "$XCCONFIG_DEBUG_PATH"
              echo "Added Pods debug include to $XCCONFIG_DEBUG_PATH"
          fi
          if ! grep -q "#include \"Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig\"" "$XCCONFIG_RELEASE_PATH"; then
              echo "#include \"Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig\"" >> "$XCCONFIG_RELEASE_PATH"
              echo "Added Pods release include to $XCCONFIG_RELEASE_PATH"
          fi

      - name: Clean & Install iOS Pods
        script: |
          cd ios
          pod deintegrate
          rm -f Podfile.lock
          rm -rf Pods
          pod install --repo-update
          cd $CM_BUILD_DIR

      - name: Build iOS App for Simulator
        script: |
          flutter build ios --simulator

    artifacts:
      - build/ios/iphonesimulator/**/*.app 
      - /tmp/xcodebuild_logs/*.log