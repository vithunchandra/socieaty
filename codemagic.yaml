workflows:
  Socieaty:
    name: Socieaty
    environment:
      groups:
        - socieaty
      flutter: 3.27.3
      xcode: 16.2
    scripts:
      - name: Clean Flutter project
        script: flutter clean
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Run build_runner
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Clean and Reinstall iOS Pods
        script: |
          # Navigate to the iOS directory
          cd ios
          # Remove existing Pods directory and Podfile.lock for a clean install
          rm -rf Pods
          rm -f Podfile.lock
          # Install Pods
          pod install
          # Navigate back to the root directory
          cd ..
      - name: Build unsigned .app
        script: |
          xcodebuild -workspace "ios/Runner.xcworkspace" \
            -scheme "Runner" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            SWIFT_COMPILATION_MODE=wholemodule \
            -derivedDataPath ios/output
    artifacts:
      - ios/output/Build/Products/Debug-iphonesimulator/Runner.app
