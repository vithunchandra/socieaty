workflows:
  Socieaty:
    name: Socieaty
    environment:
      groups:
        - socieaty
      flutter: 3.27.3
      xcode: 16.2
    scripts:
      - name: Clean Flutter project
        script: flutter clean
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Run build_runner
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Set iOS deployment target in Podfile
        script: |
          # Ensure the Podfile specifies a minimum iOS version compatible with Xcode 16.2 (iOS 18.2 SDK)
          # A common practice is to set it to 12.0 or higher.
          # This sed command modifies the Podfile to set platform :ios, '12.0'
          # It handles cases where the line might already exist or needs to be added.
          sed -i '' 's|# platform :ios, '\''9.0'\''|platform :ios, '\''12.0'\''|g' ios/Podfile || \
          sed -i '' 's|platform :ios, '\''[0-9.]*'\''|platform :ios, '\''12.0'\''|g' ios/Podfile || \
          echo "platform :ios, '12.0'" >> ios/Podfile
      - name: Clean and Reinstall iOS Pods
        script: |
          # Navigate to the iOS directory
          cd ios
          # Remove existing Pods directory and Podfile.lock for a clean install
          rm -rf Pods
          rm -f Podfile.lock
          # Install Pods
          pod install
          # Navigate back to the root directory
          cd ..
      - name: Build unsigned .app
        script: |
          xcodebuild -workspace "ios/Runner.xcworkspace" \
            -scheme "Runner" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16, OS=18.2' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath ios/output
    artifacts:
      - ios/output/Build/Products/Debug-iphonesimulator/Runner.app
