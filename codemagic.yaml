workflows:
  ios-app-build:
    name: iOS App Build
    instance_type: mac_mini_m2

    environment:
      groups:
        - socieaty

    scripts:
      - name: Get Flutter dependencies and generate code
        script: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Install iOS Pods
        script: |
          cd ios
          # Recommended for clean CI builds:
          pod deintegrate
          rm -f Podfile.lock # Use -f for force removal without prompt
          pod install --repo-update
          cd $CM_BUILD_DIR

      - name: Build iOS App
        script: |
          flutter build ios --release # Example: for App Store distribution

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
